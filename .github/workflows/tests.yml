# Draft CI: not yet run on GitHub. Model-dependent tests skip themselves when add-ons are absent.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System tools (ffmpeg, exiftool, tesseract) and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libimage-exiftool-perl tesseract-ocr libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
