# GS1 company-prefix ranges (first three digits of an EAN-13 / UPC-A as 0 + 12 digits). The prefix says where
# the brand owner registered the barcode, not where the product was made or is sold. Compiled from the public
# GS1 prefix list; verify against GS1 before relying on a single entry.
